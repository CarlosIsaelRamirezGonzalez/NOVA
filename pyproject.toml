# Versión web de Nova en Vercel.
# En la Mac se sigue instalando con `pip install -r requirements.txt`; este archivo solo lista lo
# que necesita la web, sin Vosk, Whisper, InsightFace ni Qdrant, que no caben ni sirven ahí.

[project]
name = "nova"
version = "0.21.6"
description = "Compañera de IA personal con voz, emociones y memoria."
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "anthropic==2.6.0",
    "certifi==2026.10.23",
    "fastapi==0.162.0",
    "markdown==3.11.2",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pyturso==0.8.3",
    "uvicorn[standard]==0.54.0",
]

[tool.vercel]
entrypoint = "web.app:app"

[tool.vercel.scripts]
# Compila la interfaz antes de desplegar; FastAPI la sirve desde frontend/dist.
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.vercel.fastapi.static]
# La interfaz se sirve desde la CDN; no hace falta dentro de la función.
exclude = true
